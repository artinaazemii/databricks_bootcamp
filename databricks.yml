bundle:
  name: databricks_bootcamp

targets:
  dev:
    workspace:
      host: https://dbc-b8b98f1f-7bcf.cloud.databricks.com/browse/folders/3698059308480729?o=309869074317167

resources:
  jobs:
    bootcamp_job:
      name: bootcamp_orchestration

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./bronze/bronze_ingestion

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./silver/silver_orchestration

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./gold/gold_orchestration
